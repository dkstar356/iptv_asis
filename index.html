  <title>U+tv 홈 화면 프로토타입</title>
  <style>
    :root { background:#080808; color-scheme:dark; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080808; }
    body { display:grid; place-items:center; font-family:Arial, "Noto Sans KR", sans-serif; }
    .tv { position:relative; width:min(100vw, calc(100vh * 1.7777778)); aspect-ratio:16 / 9; overflow:hidden; background:#000; outline:none; }
    .screen { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    .screen.is-current { opacity:1; }
    .counter { position:absolute; right:26px; bottom:22px; z-index:2; padding:8px 11px; border-radius:999px; color:#fff; background:rgb(0 0 0 / 65%); font:500 13px/1 Arial, sans-serif; opacity:0; transition:opacity .18s; pointer-events:none; }
    .tv.show-counter .counter { opacity:1; }
  </style>
</head>

            return;
          }
          if (event.key === 'ArrowLeft') {
            if (oakColumn > 0) moveOakHorizontal(-1);
            else returnHomeToOakBanner();
            return;
          }
          if (event.key === 'ArrowDown') moveOakVertical(1);
          if (event.key === 'ArrowUp') moveOakVertical(-1);
          if (event.key === 'ArrowRight') moveOakHorizontal(1);
          return;
        }
        if (view === 'bikwang') {
          if (event.key === 'Escape') {
            returnHomeToBikwangBanner();
            return;
          }
          if (bikwangRow === 5 && (event.key === 'Enter' || event.key === 'Home')) {
            returnToBikwangMain();
            return;
          }
          if (event.key === 'ArrowLeft') {
            if (bikwangColumn > 0) moveBikwangHorizontal(-1);
            else returnHomeToBikwangBanner();
            return;
          }
          if (event.key === 'ArrowDown') moveBikwangVertical(1);
          if (event.key === 'ArrowUp') moveBikwangVertical(-1);
          if (event.key === 'ArrowRight') moveBikwangHorizontal(1);
          return;
        }
        if (view === 'spiderMan') {
          if (event.key === 'Escape') {
            returnHomeToSpiderManBanner();
            return;
          }
          if (spiderManRow === 6 && (event.key === 'Enter' || event.key === 'Home')) {
            returnToSpiderManMain();
            return;
          }
          if (event.key === 'ArrowLeft') {
            if (spiderManColumn > 0) moveSpiderManHorizontal(-1);
            else returnHomeToSpiderManBanner();
            return;
          }
          if (event.key === 'ArrowDown') moveSpiderManVertical(1);
          if (event.key === 'ArrowUp') moveSpiderManVertical(-1);
          if (event.key === 'ArrowRight') moveSpiderManHorizontal(1);
          return;
        }
        if (view === 'okayMadamSeries') {
          if (event.key === 'Escape') returnToOkayMadamSeriesBase();
          if (event.key === 'ArrowDown') moveOkayMadamSeries(1);
          if (event.key === 'ArrowUp') moveOkayMadamSeries(-1);
          return;
        }
        if (view === 'okayMadam') {
          if (event.key === 'Escape') {
            returnHomeToOkayMadamBanner();
            return;
          }
          if (okayMadamRow === 9 && (event.key === 'Enter' || event.key === 'Home')) {
            returnToOkayMadamMain();
            return;
          }
          if (okayMadamRow === 0 && event.key === 'Enter') {
            enterOkayMadamSeries();
            return;
          }
          if (event.key === 'ArrowLeft') {
            if (okayMadamColumn > 0) moveOkayMadamHorizontal(-1);
            else returnHomeToOkayMadamBanner();
            return;
          }
          if (event.key === 'ArrowDown') moveOkayMadamVertical(1);
          if (event.key === 'ArrowUp') moveOkayMadamVertical(-1);
          if (event.key === 'ArrowRight') moveOkayMadamHorizontal(1);
          return;
        }
        if (view === 'kian') {
          if (event.key === 'Escape') returnHome();
          return;
        }
        if (view === 'snb') {
          if (snbDepth === 'all') {
            if (allMenuCurrent === 0 && event.key === 'ArrowRight') {
              enterMovieDramaMenu();
              return;
            }
            if (event.key === 'ArrowLeft') returnAllMenu();
            if (event.key === 'ArrowDown') moveAllMenu(1);
            if (event.key === 'ArrowUp') moveAllMenu(-1);
            return;
          }
          if (snbDepth === 'movieDrama') {
            if (event.key === 'ArrowLeft') returnMovieDramaMenu();
            if (event.key === 'ArrowDown') moveMovieDramaMenu(1);
            if (event.key === 'ArrowUp') moveMovieDramaMenu(-1);
            return;
          }
          if (snbDepth === 'detail') {
            if (event.key === 'ArrowLeft') returnSnbDetail();
            return;
          }
          if (snbCurrent === 1 && event.key === 'ArrowRight') {
            enterAllMenu();
            return;
          }
          if (snbCurrent === 2 && event.key === 'ArrowRight') {
            returnHome();
            return;
          }
          if (snbCurrent >= 3 && snbCurrent <= 6 && event.key === 'ArrowRight') {
            enterSnbDetail();
            return;
          }
          if (snbCurrent <= 7) {
            if (event.key === 'ArrowDown') moveSnbVertical(1);
            if (event.key === 'ArrowUp') moveSnbVertical(-1);
          }
          if (snbCurrent >= 7) {
            if (event.key === 'ArrowRight') moveSnbHorizontal(1);
            if (event.key === 'ArrowLeft') moveSnbHorizontal(-1);
          }
          return;
        }
        if (view === 'obsession') {
          if (obsessionCurrent === 0 && event.key === 'ArrowLeft') {
            view = 'home';
            current = 0;
            horizontalCurrent = 1;
            show(heroImages[horizontalCurrent]);
            announce();
            return;
          }
          if (obsessionCurrent === 1 && obsessionPreviewCurrent > 0) {
            if (event.key === 'ArrowLeft') moveObsessionPreview(-1);
            return;
          }
          if (obsessionCurrent === 1 && event.key === 'ArrowRight') {
            moveObsessionPreview(1);
            return;
          }
          if (event.key === 'ArrowDown') moveObsession(1);
          if (event.key === 'ArrowUp') moveObsession(-1);
          if (event.key === 'Enter' && obsessionCurrent === obsessionImages.length - 1) {
            obsessionCurrent = 0;
            obsessionPreviewCurrent = 0;
            show(obsessionImages[obsessionCurrent]);
            announce();
          }
          return;
        }
        if (view === 'detail') {
          const isPrevious = ['ArrowLeft', 'Backspace', 'Escape', 'BrowserBack', 'GoBack'].includes(event.key);
          if (detailCurrent === 0 && detailBranch === 'favorite') {
            if (moreActive) {
              if (event.key === 'ArrowDown') returnToFavoriteBase();
              return;
            }
            if (favoriteCurrent === 0 && event.key === 'ArrowUp') {
              showMore();
              return;
            }
            if (event.key === 'ArrowDown') {
              returnToDetailBase();
              return;
            }
            if (event.key === 'ArrowRight') {
              moveFavorite(1);
              return;
            }
            if (event.key === 'ArrowLeft') {
              moveFavorite(-1);
              return;
            }
            return;
          }
          if (detailCurrent === 0 && detailBranch !== 'base' && event.key === 'ArrowLeft') {
            returnToDetailBase();
            return;
          }
          if (detailCurrent === 0 && detailBranch === 'base' && isPrevious) {
            returnHome();
            return;
          }
          if (detailCurrent === 0 && detailBranch === 'base' && event.key === 'ArrowRight') {
            showDetailBranch('right');
            return;
          }
          if (detailCurrent === 0 && detailBranch === 'base' && event.key === 'ArrowUp') {
            favoriteCurrent = 0;
            moreActive = false;
            showDetailBranch('favorite');
            return;
          }
          if (detailCurrent === 2 && detailBranch === 'base' && event.key === 'ArrowRight') {
            movePreview(1);
            return;
          }
          if (detailCurrent === 2 && detailBranch === 'base' && previewCurrent > 0) {
            if (event.key === 'ArrowLeft') movePreview(-1);
            return;
          }
          if (detailCurrent === 3 && detailBranch === 'base' && event.key === 'ArrowRight') {
            movePerson(1);
            return;
          }
          if (detailCurrent === 3 && detailBranch === 'base' && personCurrent > 0) {
            if (event.key === 'ArrowLeft') movePerson(-1);
            return;
          }
          if (detailBranch !== 'base') return;
          if (event.key === 'ArrowDown') moveDetail(1);
          if (event.key === 'ArrowUp') moveDetail(-1);
          if (event.key === 'Enter' && detailCurrent === detailImages.length - 1) {
            detailCurrent = 0;
            detailBranch = 'base';
            favoriteCurrent = 0;
            moreActive = false;
            previewCurrent = 0;
            personCurrent = 0;
            show(detailImages[detailCurrent]);
            announce();
          }
          return;
        }
        if (event.key === 'ArrowDown') move(1);
        if (event.key === 'ArrowUp') move(-1);
        if (event.key === 'ArrowRight') moveHero(1);
        if (event.key === 'ArrowLeft' && horizontalCurrent === 0) {
          enterSnb();
          return;
        }
        if (event.key === 'ArrowLeft') moveHero(-1);
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 0) enterDetail();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 1) enterObsession();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 2) enterOkayMadam();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 3) enterKian();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 4) enterSpiderMan();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 5) enterBikwang();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 6) enterOak();
        if (event.key === 'Enter' && current === 0 && horizontalCurrent === 7) enterTodayRecommendation();
      });
      window.addEventListener('wheel', event => event.preventDefault(), { passive:false });
      tv.focus();
      show(images[0]);
      announce();
    })();
  </script>
</body>
</html>
